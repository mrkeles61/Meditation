<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Asset Preview — Ultraviolet Perigee</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --border:   #2a2a3a;
    --accent:   #c8956c;
    --accent2:  #7c6af7;
    --text:     #e8e8f0;
    --muted:    #888899;
    --win-zen:  #4caf50;
    --win-fit:  #ff9800;
    --sidebar:  280px;
    --panel:    260px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  header span { font-size: 12px; color: var(--muted); }
  .header-btns { display: flex; gap: 8px; }
  .btn {
    padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); transition: all .15s;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); color: #0a0a0f; border-color: var(--accent); }
  .btn-primary:hover { opacity: .85; }
  .btn-sm { padding: 4px 10px; font-size: 11px; }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .zone-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .zone-tab {
    flex: 1;
    padding: 9px 6px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all .15s;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .zone-tab:hover { color: var(--text); }
  .zone-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .theme-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .theme-list::-webkit-scrollbar { width: 4px; }
  .theme-list::-webkit-scrollbar-track { background: transparent; }
  .theme-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .theme-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .15s;
    position: relative;
  }
  .theme-card:hover { background: rgba(255,255,255,.04); border-color: var(--border); }
  .theme-card.active { background: rgba(200,149,108,.08); border-color: var(--accent); }

  .theme-thumb {
    width: 64px;
    height: 36px;
    border-radius: 4px;
    object-fit: cover;
    background: var(--border);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .theme-thumb-placeholder {
    width: 64px; height: 36px; border-radius: 4px;
    background: var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--muted);
  }
  .theme-info { flex: 1; min-width: 0; }
  .theme-name { font-size: 11px; font-weight: 600; line-height: 1.3; }
  .theme-sub  { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .theme-wins { display: flex; gap: 3px; margin-top: 3px; }
  .win-pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border);
  }
  .win-pip.filled { background: var(--win-zen); }
  .win-pip.filled.fitness { background: var(--win-fit); }

  /* ── Main view ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .main-top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .main-top h2 { font-size: 14px; font-weight: 700; flex: 1; }
  .main-top .zone-badge {
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .zone-badge.zen { background: rgba(76,175,80,.2); color: #81c784; }
  .zone-badge.fitness { background: rgba(255,152,0,.2); color: #ffb74d; }

  .composite-area {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }

  /* Ground plate */
  .ground-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .ground-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; font-weight: 600;
  }
  .ground-img-wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--border);
    background: #111118;
    max-width: 620px;
    width: 100%;
  }
  .ground-img-wrap.selected-ground { border-color: var(--win-zen); }
  .ground-img-wrap.selected-ground.fitness { border-color: var(--win-fit); }
  #ground-img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: contain;
  }
  .ground-toggle {
    display: flex;
    gap: 6px;
  }
  .v-btn {
    padding: 5px 14px; border-radius: 6px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); transition: all .15s;
  }
  .v-btn.active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); }
  .v-btn:hover:not(.active) { background: var(--border); color: var(--text); }

  .select-bar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .win-btn {
    padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); transition: all .15s;
  }
  .win-btn:hover { background: rgba(76,175,80,.15); border-color: #4caf50; color: #81c784; }
  .win-btn.selected { background: rgba(76,175,80,.25); border-color: #4caf50; color: #81c784; }
  .win-btn.selected::before { content: "✓ "; }
  .win-btn.fitness:hover,
  .win-btn.fitness.selected { background: rgba(255,152,0,.2); border-color: #ff9800; color: #ffb74d; }
  .win-btn.fitness.selected::before { content: "✓ "; }

  /* Building */
  .building-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .building-img-wrap {
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--border);
    background: #111118;
    width: 240px;
  }
  .building-img-wrap.selected-building { border-color: var(--win-zen); }
  .building-img-wrap.selected-building.fitness { border-color: var(--win-fit); }
  #building-img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  .missing-img {
    width: 100%; aspect-ratio: 16/9;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: var(--muted); font-size: 13px;
  }
  .missing-img .icon { font-size: 36px; opacity: .4; }

  /* ── Right panel ── */
  .panel {
    width: var(--panel);
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-count {
    background: var(--accent);
    color: #0a0a0f;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .selections-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .sel-item {
    padding: 7px 9px;
    border-radius: 6px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.02);
    font-size: 11px;
  }
  .sel-item .sel-name { font-weight: 600; color: var(--text); }
  .sel-item .sel-detail { color: var(--muted); margin-top: 2px; }
  .sel-item .sel-remove {
    float: right; cursor: pointer; color: var(--muted);
    font-size: 13px; line-height: 1; margin-left: 4px;
  }
  .sel-item .sel-remove:hover { color: #f44336; }
  .empty-sel { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 12px; }
  .panel-footer {
    padding: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ── Progress bar ── */
  .progress-bar-wrap {
    padding: 6px 14px 0;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .progress-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .progress-bar {
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px; transition: width .3s;
  }

  .img-status {
    font-size: 10px; color: var(--muted);
    padding: 2px 0;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <h1>🏙 Zone Asset Preview</h1>
    <span id="gen-progress">Loading…</span>
  </div>
  <div class="header-btns">
    <button class="btn" onclick="clearAll()">Clear All Selections</button>
    <button class="btn btn-primary" onclick="downloadWinners()">⬇ Download winners.json</button>
  </div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="zone-tabs">
      <div class="zone-tab active" onclick="switchZone('zen')" id="tab-zen">Zen Zone</div>
      <div class="zone-tab"        onclick="switchZone('fitness')" id="tab-fitness">Fitness Zone</div>
    </div>
    <div class="theme-list" id="theme-list"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-top">
      <span class="zone-badge zen" id="zone-badge">ZEN</span>
      <h2 id="theme-title">Select a theme</h2>
      <span id="theme-index" style="font-size:11px;color:var(--muted)"></span>
    </div>

    <div class="composite-area" id="composite">

      <!-- Ground section -->
      <div class="ground-box">
        <div class="ground-label">Ground Plate</div>
        <div class="ground-img-wrap" id="ground-wrap">
          <div class="missing-img"><div class="icon">🌍</div>Select a theme</div>
        </div>
        <div class="ground-toggle">
          <button class="v-btn active" id="gv1" onclick="setGroundV(1)">v1</button>
          <button class="v-btn"        id="gv2" onclick="setGroundV(2)">v2</button>
        </div>
        <div class="select-bar">
          <button class="win-btn" id="win-ground-btn" onclick="toggleWinGround()">Mark Ground as Winner</button>
          <span id="ground-status" class="img-status"></span>
        </div>
      </div>

      <!-- Building section -->
      <div class="building-box">
        <div class="ground-label">Building</div>
        <div class="building-img-wrap" id="building-wrap">
          <div class="missing-img" style="aspect-ratio:1/1"><div class="icon">🏛</div>Select a theme</div>
        </div>
        <div class="select-bar">
          <button class="win-btn" id="win-building-btn" onclick="toggleWinBuilding()">Mark Building as Winner</button>
          <span id="building-status" class="img-status"></span>
        </div>
      </div>

    </div>

    <div class="progress-bar-wrap">
      <div class="progress-label" id="progress-label">0 / 18 themes have a ground winner selected</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </main>

  <!-- Right panel -->
  <aside class="panel">
    <div class="panel-header">
      Selections
      <span class="panel-count" id="sel-count">0</span>
    </div>
    <div class="selections-list" id="sel-list">
      <div class="empty-sel">No winners selected yet.<br>Pick ground + building for each theme.</div>
    </div>
    <div class="panel-footer">
      <button class="btn btn-sm" onclick="copyJSON()" style="width:100%">Copy JSON to clipboard</button>
      <button class="btn btn-sm btn-primary" onclick="downloadWinners()" style="width:100%">⬇ Download winners.json</button>
    </div>
  </aside>

</div>

<script>
// ── Theme data (mirrors generate_themed_assets.py) ─────────────────────────
const THEMES = [
  // ZEN
  { zone:'zen_zone', slug:'theme_01_japanese_garden',   label:'Traditional Japanese Garden',         idx:1 },
  { zone:'zen_zone', slug:'theme_02_origami_world',     label:'Paper Craft Origami World',            idx:2 },
  { zone:'zen_zone', slug:'theme_03_tree_of_life',      label:'Mystical Tree of Life',                idx:3 },
  { zone:'zen_zone', slug:'theme_04_autumn_maple',      label:'Autumn Maple Temple',                  idx:4 },
  { zone:'zen_zone', slug:'theme_05_tropical_waterfall',label:'Tropical Waterfall Lagoon',            idx:5 },
  { zone:'zen_zone', slug:'theme_06_greenhouse_conservatory', label:'Greenhouse Conservatory Garden', idx:6 },
  { zone:'zen_zone', slug:'theme_07_underwater_reef',   label:'Underwater Coral Reef',                idx:7 },
  { zone:'zen_zone', slug:'theme_08_floating_cloud_temple', label:'Floating Cloud Temple',            idx:8 },
  { zone:'zen_zone', slug:'theme_09_classic_pagoda',    label:'Classic Japanese Pagoda (Style Ref)',  idx:9 },
  // FITNESS
  { zone:'fitness_zone', slug:'theme_01_greek_olympic',   label:'Ancient Greek Olympic Grounds',       idx:1 },
  { zone:'fitness_zone', slug:'theme_02_roman_colosseum', label:'Roman Gladiator Training Colosseum',  idx:2 },
  { zone:'fitness_zone', slug:'theme_03_cloud_athletics', label:'Floating Cloud Kingdom Athletics',    idx:3 },
  { zone:'fitness_zone', slug:'theme_04_shaolin_temple',  label:'Shaolin Temple Training Courtyard',   idx:4 },
  { zone:'fitness_zone', slug:'theme_05_viking_camp',     label:'Viking Warrior Training Camp',        idx:5 },
  { zone:'fitness_zone', slug:'theme_06_samurai_dojo',    label:'Samurai Dojo Compound',               idx:6 },
  { zone:'fitness_zone', slug:'theme_07_treehouse_course',label:'Treehouse Adventure Course',          idx:7 },
  { zone:'fitness_zone', slug:'theme_08_cyberpunk_gym',   label:'Cyberpunk Neon Gym',                  idx:8 },
  { zone:'fitness_zone', slug:'theme_09_jungle_ruins',    label:'Jungle Temple Ruins Parkour',         idx:9 },
];

// ── State ──────────────────────────────────────────────────────────────────
const BASE = 'generated_assets';

let currentZone    = 'zen_zone';
let currentTheme   = null;
let currentGroundV = 1;
// selections: { [zone/slug]: { groundV: 1|2|null, building: true|false } }
let selections = JSON.parse(localStorage.getItem('uv_winners') || '{}');

// ── Helpers ────────────────────────────────────────────────────────────────
function imgPath(zone, slug, file) {
  return `${BASE}/${zone}/${slug}/${file}`;
}

function themeKey(t) { return `${t.zone}/${t.slug}`; }

function isFitness(t) { return t.zone === 'fitness_zone'; }

function getSel(t) {
  return selections[themeKey(t)] || { groundV: null, building: false };
}

function setSel(t, patch) {
  const key = themeKey(t);
  selections[key] = Object.assign(getSel(t), patch);
  if (!selections[key].groundV && !selections[key].building) delete selections[key];
  save();
}

function save() {
  localStorage.setItem('uv_winners', JSON.stringify(selections));
  renderPanel();
  renderProgress();
  renderSidebarPips();
}

// ── Zone switch ────────────────────────────────────────────────────────────
function switchZone(z) {
  currentZone = z === 'zen' ? 'zen_zone' : 'fitness_zone';
  document.getElementById('tab-zen').classList.toggle('active', z === 'zen');
  document.getElementById('tab-fitness').classList.toggle('active', z === 'fitness');
  renderSidebar();
  currentTheme = null;
  renderMain();
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('theme-list');
  const themes = THEMES.filter(t => t.zone === currentZone);
  list.innerHTML = themes.map(t => {
    const key   = themeKey(t);
    const sel   = getSel(t);
    const isAct = currentTheme && themeKey(currentTheme) === key;
    const fit   = isFitness(t) ? 'fitness' : '';
    const gPip  = sel.groundV   ? `<div class="win-pip filled ${fit}"></div>` : `<div class="win-pip"></div>`;
    const bPip  = sel.building  ? `<div class="win-pip filled ${fit}"></div>` : `<div class="win-pip"></div>`;
    const thumb = `<img class="theme-thumb" src="${imgPath(t.zone, t.slug, 'ground_v1.png')}"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                     loading="lazy" alt="">
                   <div class="theme-thumb-placeholder" style="display:none">🌄</div>`;
    return `<div class="theme-card ${isAct ? 'active' : ''}" data-key="${key}" onclick="selectTheme('${key}')">
      ${thumb}
      <div class="theme-info">
        <div class="theme-name">${t.label}</div>
        <div class="theme-sub">Theme ${t.idx}</div>
        <div class="theme-wins">${gPip}${bPip}</div>
      </div>
    </div>`;
  }).join('');
}

function renderSidebarPips() {
  THEMES.forEach(t => {
    const card = document.querySelector(`[data-key="${themeKey(t)}"]`);
    if (!card) return;
    const sel = getSel(t);
    const fit = isFitness(t) ? 'fitness' : '';
    const pips = card.querySelectorAll('.win-pip');
    if (pips[0]) { pips[0].className = `win-pip ${sel.groundV ? `filled ${fit}` : ''}`; }
    if (pips[1]) { pips[1].className = `win-pip ${sel.building ? `filled ${fit}` : ''}`; }
  });
}

// ── Theme selection ────────────────────────────────────────────────────────
function selectTheme(key) {
  currentTheme = THEMES.find(t => themeKey(t) === key);
  currentGroundV = 1;
  // Update active card
  document.querySelectorAll('.theme-card').forEach(c => {
    c.classList.toggle('active', c.dataset.key === key);
  });
  renderMain();
}

// ── Main view ──────────────────────────────────────────────────────────────
function renderMain() {
  const t = currentTheme;

  if (!t) {
    document.getElementById('theme-title').textContent = 'Select a theme';
    document.getElementById('zone-badge').textContent = currentZone === 'zen_zone' ? 'ZEN' : 'FIT';
    document.getElementById('zone-badge').className = `zone-badge ${currentZone === 'zen_zone' ? 'zen' : 'fitness'}`;
    document.getElementById('ground-wrap').innerHTML = '<div class="missing-img"><div class="icon">🌍</div>Select a theme</div>';
    document.getElementById('building-wrap').innerHTML = '<div class="missing-img" style="aspect-ratio:1/1"><div class="icon">🏛</div>Select a theme</div>';
    return;
  }

  const fit = isFitness(t) ? 'fitness' : '';
  const sel = getSel(t);

  document.getElementById('theme-title').textContent = t.label;
  document.getElementById('theme-index').textContent = `Theme ${t.idx} / 9`;
  document.getElementById('zone-badge').textContent = isFitness(t) ? 'FITNESS' : 'ZEN';
  document.getElementById('zone-badge').className = `zone-badge ${isFitness(t) ? 'fitness' : 'zen'}`;

  // Ground image
  const gWrap = document.getElementById('ground-wrap');
  const gSel  = sel.groundV === currentGroundV;
  gWrap.className = `ground-img-wrap${gSel ? ` selected-ground ${fit}` : ''}`;
  const gSrc  = imgPath(t.zone, t.slug, `ground_v${currentGroundV}.png`);
  gWrap.innerHTML = `<img id="ground-img" src="${gSrc}" alt="ground v${currentGroundV}"
    onerror="this.parentElement.innerHTML='<div class=missing-img><div class=icon>⏳</div><div>Not generated yet</div></div>'"
    loading="lazy">`;

  // Ground version buttons
  document.getElementById('gv1').className = `v-btn ${currentGroundV === 1 ? 'active' : ''}`;
  document.getElementById('gv2').className = `v-btn ${currentGroundV === 2 ? 'active' : ''}`;

  // Ground winner button
  const gwBtn = document.getElementById('win-ground-btn');
  gwBtn.className = `win-btn ${gSel ? 'selected' : ''} ${fit}`;
  gwBtn.textContent = gSel ? '✓ Ground Winner (v' + currentGroundV + ')' : `Mark Ground v${currentGroundV} as Winner`;

  // Ground status
  document.getElementById('ground-status').textContent = sel.groundV ? `Winner: v${sel.groundV}` : '';

  // Building image
  const bWrap = document.getElementById('building-wrap');
  const bSel  = sel.building;
  bWrap.className = `building-img-wrap${bSel ? ` selected-building ${fit}` : ''}`;
  const bSrc  = imgPath(t.zone, t.slug, 'building_v1.png');
  bWrap.innerHTML = `<img id="building-img" src="${bSrc}" alt="building"
    onerror="this.parentElement.innerHTML='<div class=missing-img style=aspect-ratio:1/1><div class=icon>⏳</div><div>Not generated yet</div></div>'"
    loading="lazy">`;

  // Building winner button
  const bwBtn = document.getElementById('win-building-btn');
  bwBtn.className = `win-btn ${bSel ? 'selected' : ''} ${fit}`;
  bwBtn.textContent = bSel ? '✓ Building Winner' : 'Mark Building as Winner';

  // Building status
  document.getElementById('building-status').textContent = bSel ? 'Selected ✓' : '';
}

function setGroundV(v) {
  currentGroundV = v;
  renderMain();
}

function toggleWinGround() {
  if (!currentTheme) return;
  const sel = getSel(currentTheme);
  if (sel.groundV === currentGroundV) {
    setSel(currentTheme, { groundV: null });
  } else {
    setSel(currentTheme, { groundV: currentGroundV });
  }
  renderMain();
  renderSidebarPips();
}

function toggleWinBuilding() {
  if (!currentTheme) return;
  const sel = getSel(currentTheme);
  setSel(currentTheme, { building: !sel.building });
  renderMain();
  renderSidebarPips();
}

// ── Right panel ────────────────────────────────────────────────────────────
function renderPanel() {
  const list    = document.getElementById('sel-list');
  const count   = document.getElementById('sel-count');
  const entries = Object.entries(selections);
  const total   = entries.reduce((n, [, v]) => n + (v.groundV ? 1 : 0) + (v.building ? 1 : 0), 0);

  count.textContent = total;

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-sel">No winners selected yet.<br>Pick ground + building for each theme.</div>';
    return;
  }

  list.innerHTML = THEMES.filter(t => selections[themeKey(t)])
    .map(t => {
      const key = themeKey(t);
      const sel = selections[key];
      const fit = isFitness(t) ? 'fitness' : '';
      const lines = [];
      if (sel.groundV)  lines.push(`Ground: v${sel.groundV}`);
      if (sel.building) lines.push('Building: v1');
      return `<div class="sel-item">
        <span class="sel-remove" onclick="removeSel('${key}')" title="Remove">✕</span>
        <div class="sel-name" style="color:${isFitness(t) ? '#ffb74d' : '#81c784'}">${t.label}</div>
        <div class="sel-detail">${lines.join(' · ')}</div>
      </div>`;
    }).join('');
}

function removeSel(key) {
  delete selections[key];
  save();
  if (currentTheme && themeKey(currentTheme) === key) renderMain();
  renderSidebarPips();
}

function clearAll() {
  if (!confirm('Clear all winner selections?')) return;
  selections = {};
  save();
  renderMain();
  renderSidebarPips();
}

// ── Progress ───────────────────────────────────────────────────────────────
function renderProgress() {
  const groundWins = Object.values(selections).filter(v => v.groundV).length;
  const pct = Math.round(groundWins / 18 * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent =
    `${groundWins} / 18 themes have a ground winner  ·  ${Object.values(selections).filter(v=>v.building).length} / 18 building winners`;
}

// ── Export ─────────────────────────────────────────────────────────────────
function buildWinnersJSON() {
  const out = {};
  THEMES.forEach(t => {
    const key = themeKey(t);
    const sel = selections[key];
    if (!sel) return;
    out[key] = {
      zone:      t.zone,
      slug:      t.slug,
      label:     t.label,
      ground:    sel.groundV ? imgPath(t.zone, t.slug, `ground_v${sel.groundV}.png`) : null,
      building:  sel.building ? imgPath(t.zone, t.slug, 'building_v1.png') : null,
      groundV:   sel.groundV || null,
    };
  });
  return out;
}

function copyJSON() {
  const json = JSON.stringify(buildWinnersJSON(), null, 2);
  navigator.clipboard.writeText(json).then(() => alert('Copied to clipboard!')).catch(() => {
    prompt('Copy this JSON:', json);
  });
}

function downloadWinners() {
  const json = JSON.stringify(buildWinnersJSON(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'winners.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Image generation progress check ───────────────────────────────────────
async function checkGenerationProgress() {
  try {
    const r = await fetch('generated_assets/themed_generation_log.json');
    if (!r.ok) throw new Error();
    const log  = await r.json();
    const ok   = log.filter(e => e.success).length;
    const fail = log.filter(e => !e.success).length;
    const latest = log.filter(e => e.success).at(-1);
    let txt = `Generated: ${ok}/54`;
    if (fail) txt += ` (${fail} failed)`;
    if (ok < 54 && latest) txt += ` · Latest: ${latest.label}`;
    if (ok >= 54) txt += ' ✓ complete';
    document.getElementById('gen-progress').textContent = txt;
  } catch {
    document.getElementById('gen-progress').textContent = 'Generation log not found (run script first)';
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
renderSidebar();
renderPanel();
renderProgress();
checkGenerationProgress();
setInterval(checkGenerationProgress, 10000); // refresh every 10s

// Keyboard: arrow keys to navigate themes, 1/2 to switch ground version
document.addEventListener('keydown', e => {
  const zen     = THEMES.filter(t => t.zone === currentZone);
  const idx     = currentTheme ? zen.findIndex(t => themeKey(t) === themeKey(currentTheme)) : -1;

  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    const next = zen[idx + 1] || zen[0];
    selectTheme(themeKey(next));
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    const prev = zen[idx - 1] || zen[zen.length - 1];
    selectTheme(themeKey(prev));
  } else if (e.key === '1') {
    setGroundV(1);
  } else if (e.key === '2') {
    setGroundV(2);
  } else if (e.key === 'g' || e.key === 'G') {
    toggleWinGround();
  } else if (e.key === 'b' || e.key === 'B') {
    toggleWinBuilding();
  }
});
</script>
</body>
